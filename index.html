<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>宝石クエスト</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
/* Layout: one readable column. Home = progress + chapters of stage rows; play = one big question card at a time. */
:root{
  --bg:#f7f4f2; --surface:#ffffff; --sunk:#f1ece9; --fg:#1f1a1d; --muted:#665c62; --line:#e2d9dc;
  --accent:#9b1d3a; --accent-fg:#ffffff; --accent-soft:#f6e2e7;
  --ok:#17744f; --ok-soft:#ddf1e7; --ng:#b2361b; --ng-soft:#fbe5df; --gold:#b07d12; --gold-soft:#f8eed4;
  --tip:#1d4f86; --tip-soft:#e3edf8;
  --head:"Zen Maru Gothic","Hiragino Maru Gothic ProN","BIZ UDPGothic",sans-serif;
  --body:"BIZ UDPGothic","Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#17131a; --surface:#221c24; --sunk:#1b161d; --fg:#f3edf0; --muted:#b2a6ad; --line:#3a3039;
  --accent:#e2617f; --accent-fg:#1b0e13; --accent-soft:#3c1e28;
  --ok:#5fd09d; --ok-soft:#163126; --ng:#f2896d; --ng-soft:#3a211b; --gold:#e6b950; --gold-soft:#3a2f17;
  --tip:#8dbbf0; --tip-soft:#1b2a3d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17131a; --surface:#221c24; --sunk:#1b161d; --fg:#f3edf0; --muted:#b2a6ad; --line:#3a3039;
  --accent:#e2617f; --accent-fg:#1b0e13; --accent-soft:#3c1e28;
  --ok:#5fd09d; --ok-soft:#163126; --ng:#f2896d; --ng-soft:#3a211b; --gold:#e6b950; --gold-soft:#3a2f17;
  --tip:#8dbbf0; --tip-soft:#1b2a3d; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:17px;line-height:1.8;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding-block:24px 72px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:22px}
h1,h2,h3{font-family:var(--head);text-wrap:balance;margin:0;line-height:1.35}
.brand{display:flex;align-items:center;gap:14px}
.brand svg{flex:none}
.brand h1{font-size:clamp(28px,7vw,38px);font-weight:900;letter-spacing:.02em}
.brand p{margin:2px 0 0;color:var(--muted);font-size:15px}
.nav{display:flex;gap:8px;flex-wrap:wrap}
.nav button{padding:8px 18px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:700;font-size:15px}
.nav button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
/* progress panel */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 20px;display:flex;flex-direction:column;gap:12px}
.prog-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.prog-top b{font-family:var(--head);font-size:22px;font-variant-numeric:tabular-nums}
.bar{height:10px;background:var(--sunk);border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--gold));border-radius:6px;transition:width .4s}
.prog-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:15px;color:var(--muted)}
.prog-row .sp{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 18px;border-radius:12px;border:0;background:var(--accent);color:var(--accent-fg);font-weight:700;cursor:pointer;min-height:46px}
.btn.sub{background:var(--surface);color:var(--fg);border:1.5px solid var(--line)}
.btn.sub:hover{border-color:var(--accent)}
.btn[disabled]{opacity:.45;cursor:default}
/* chapters */
.chapter{display:flex;flex-direction:column;gap:10px}
.ch-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;padding-bottom:6px;border-bottom:2px solid var(--fg)}
.ch-no{font-family:var(--head);font-weight:900;color:var(--accent);font-size:15px;letter-spacing:.08em}
.ch-head h2{font-size:22px}
.ch-head .meta{margin-left:auto;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.stage{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.stage.done{border-color:color-mix(in srgb,var(--ok) 45%,var(--line))}
.st-no{font-family:var(--head);font-weight:900;text-align:center;line-height:1.1;color:var(--accent)}
.st-no small{display:block;font-family:var(--body);font-size:11px;letter-spacing:.12em;color:var(--muted);font-weight:700}
.st-no b{font-size:24px}
.st-body h3{font-size:18px}
.st-meta{display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--muted);margin-top:2px}
.stars{color:var(--gold);letter-spacing:1px;font-size:14px}
.stars i{font-style:normal;color:var(--line)}
.badge{font-size:12px;font-weight:700;padding:2px 10px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.badge.clear{background:var(--ok-soft);color:var(--ok)}
.badge.perfect{background:var(--gold-soft);color:var(--gold)}
.st-act{display:flex;gap:8px}
.st-act .btn{min-height:42px;padding:8px 14px;font-size:15px}
.stage.final{background:var(--accent-soft);border-color:transparent}
.stage.is-next{border:2px solid var(--accent)}
.next{display:flex;align-items:center;gap:14px;background:var(--accent-soft);border-radius:16px;padding:16px 20px}
.next div{flex:1;min-width:0;display:flex;flex-direction:column}
.next small{font-size:13px;font-weight:700;color:var(--accent);letter-spacing:.06em}
.next b{font-family:var(--head);font-size:19px;line-height:1.4}
.next span{font-size:13px;color:var(--muted)}
.toc{display:flex;flex-wrap:wrap;gap:8px}
.toc a{display:flex;flex-direction:column;text-decoration:none;color:var(--fg);background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:6px 12px;font-size:12px;font-weight:700;color:var(--accent);line-height:1.4}
.toc a span{color:var(--fg);font-size:14px}
.toc a.done{border-color:color-mix(in srgb,var(--ok) 55%,var(--line))}
.toc a:hover{border-color:var(--accent)}
.vol{text-align:center;font-size:14px;font-weight:700;color:var(--muted);padding:6px 0;border-top:1px dashed var(--line);border-bottom:1px dashed var(--line)}
.chapter{scroll-margin-top:16px}
@media (max-width:560px){.next{flex-direction:column;align-items:stretch}.toc a{flex:1 1 calc(33% - 8px)}}
@media (max-width:560px){.stage{grid-template-columns:52px minmax(0,1fr)}.st-act{grid-column:1/-1}.st-act .btn{flex:1}}
/* play */
.playbar{display:flex;align-items:center;gap:12px}
.playbar .ttl{flex:1;min-width:0;font-weight:700;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.playbar .count{font-variant-numeric:tabular-nums;color:var(--muted);font-size:15px}
.linkbtn{background:none;border:0;color:var(--muted);cursor:pointer;padding:6px 4px;font-size:15px}
.linkbtn:hover{color:var(--fg)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:16px}
.qlabel{display:flex;gap:10px;align-items:center;font-size:13px;color:var(--muted);font-weight:700}
.streak{margin-left:auto;color:var(--gold)}
.q{font-size:21px;font-weight:700;line-height:1.65;margin:0}
.fig{background:var(--sunk);border-radius:14px;display:flex;flex-direction:column;align-items:center;padding:12px;gap:4px}
.fig svg{width:min(240px,70vw);height:auto;display:block}
.fig small{font-size:12px;color:var(--muted)}
.choices{display:flex;flex-direction:column;gap:10px}
.choice{display:flex;gap:14px;align-items:center;text-align:left;padding:14px 16px;min-height:58px;border-radius:14px;border:2px solid var(--line);background:var(--bg);cursor:pointer;font-size:18px;line-height:1.5}
.choice .k{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:1.5px solid var(--line);font-weight:700;font-size:15px;color:var(--muted)}
.choice:hover:not(:disabled){border-color:var(--accent)}
.choice:disabled{cursor:default}
.choice.correct{background:var(--ok-soft);border-color:var(--ok)}
.choice.correct .k{background:var(--ok);color:var(--surface);border-color:var(--ok)}
.choice.wrong{background:var(--ng-soft);border-color:var(--ng)}
.choice.wrong .k{background:var(--ng);color:var(--surface);border-color:var(--ng)}
.choice.dim{opacity:.55}
.verdict{font-family:var(--head);font-weight:900;font-size:24px;display:flex;align-items:center;gap:10px}
.verdict.ok{color:var(--ok)} .verdict.ng{color:var(--ng)}
.answer{font-weight:700;font-size:18px}
.explain{display:flex;flex-direction:column;gap:10px;animation:rise .25s ease}
.explain p{margin:0}
.tip{background:var(--tip-soft);color:var(--fg);border-radius:12px;padding:10px 14px;font-size:15px}
.tip b{color:var(--tip);display:block;font-size:13px;letter-spacing:.06em}
.src{font-size:13px;color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row .btn{flex:1 1 160px}
@keyframes rise{from{transform:translateY(6px);opacity:.3}to{transform:none;opacity:1}}
/* flash card */
.flip-hint{font-size:14px;color:var(--muted);text-align:center}
.reveal{border-top:2px dashed var(--line);padding-top:16px}
.hintc{display:flex;flex-wrap:wrap;gap:8px}
.hintc span{background:var(--sunk);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:15px}
/* result */
.result{text-align:center;align-items:center}
.score{font-family:var(--head);font-weight:900;font-size:64px;line-height:1;color:var(--accent);font-variant-numeric:tabular-nums;animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
.score small{font-size:24px;color:var(--muted)}
.rmsg{font-size:19px;font-weight:700;margin:0}
.gems{display:flex;gap:6px;justify-content:center}
.gems span{width:18px;height:18px;transform:rotate(45deg);border-radius:3px;background:var(--line)}
.gems span.on{background:linear-gradient(135deg,var(--gold),var(--accent));animation:pop .5s backwards}
@keyframes pop{from{transform:scale(.4) rotate(45deg);opacity:0}}
.score{animation-name:popn}@keyframes popn{from{transform:scale(.6);opacity:0}}
.missed{text-align:left;width:100%;display:flex;flex-direction:column;gap:8px}
.missed h3{font-size:17px}
.miss{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:15px}
.miss b{color:var(--ok)}
/* booklet */
.book{display:flex;flex-direction:column;gap:26px}
.book-ctl{display:flex;gap:8px;flex-wrap:wrap}
.bstage h3{font-size:19px;border-left:5px solid var(--accent);padding-left:10px;margin-bottom:10px}
.bq{margin:0 0 14px;break-inside:avoid}
.bq p{margin:0;font-weight:700}
.bq ol{margin:4px 0 0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px 16px;font-size:16px}
.bq .fig{display:inline-flex;margin:4px 0;padding:4px}
.bq .fig svg{width:auto;height:105px;max-width:100%}
.ans{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px;font-size:15px;break-inside:avoid}
.ans h4{margin:0 0 6px;font-size:15px}
.ans ol{margin:0;padding-left:1.6em}
.note{font-size:13px;color:var(--muted)}
.hide{display:none!important}
.glos-search{width:100%;font:inherit;font-size:18px;padding:12px 16px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--fg)}
.glos-search:focus{outline:none;border-color:var(--accent)}
.glos{display:flex;flex-direction:column;gap:8px}
.term{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px}
.term h3{font-size:18px}
.term p{margin:2px 0 0}
.term .src{margin-top:2px}
.confirm{background:var(--ng-soft);border-radius:12px;padding:12px 16px;display:flex;flex-direction:column;gap:10px}
.reset{align-self:flex-start;font-size:14px}
@media (max-width:480px){.bq ol{grid-template-columns:1fr}.q{font-size:19px}.choice{font-size:17px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{
  :root{--bg:#fff;--surface:#fff;--sunk:#f4f4f4;--fg:#000;--muted:#444;--line:#aaa;--accent:#7a1530}
  .noprint{display:none!important}
  .wrap{max-width:none;padding:0}
  .bchapter+.bchapter{break-before:page}
  body{font-size:15px}
}
</style>

<div class="wrap">
  <header class="brand">
    <svg width="52" height="52" viewBox="0 0 64 64" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e2617f"/><stop offset="1" stop-color="#7a1530"/></linearGradient></defs><path d="M14 8h36l12 16-30 34L2 24z" fill="url(#lg)"/><path d="M2 24h60M14 8l8 16 10 34 10-34 8-16M22 24 32 8l10 16" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="1.6"/></svg>
    <div><h1>宝石クエスト</h1><p>買取の現場で使える宝石の知識を、ステージごとに身につける</p></div>

  <nav class="nav noprint" aria-label="表示切替">
    <button id="nav-home" aria-pressed="true">ステージ</button>

  <p class="note noprint" id="foot"></p>
</div>

<script>
/* 宝石クエスト 問題データ
   追加のしかた: CHAPTERS に章を足す／章の stages にステージを足す。
   問題: {q:問題文, c:[選択肢], a:正解の番号(0始まり), e:解説, p:テキストのページ, img:図のキー(任意), tip:買取現場メモ(任意), b:"後編"(任意。章の book より優先)} */
window.GEM_DATA = {
updated: "2026-10-31",
source: "宝石テキスト p.6〜71 ＋ 後編 p.4〜59",
chapters: [

/* ───────── 第1章 ───────── */
{ id:"c1", no:1, short:"基礎知識", title:"宝石の基礎知識", pages:"p.6〜19", stages:[

{ id:"c1s1", title:"宝石ってそもそも何？", star:1, pages:"p.6", qs:[
 {q:"岩石は何が集まってできている？", c:["宝石","鉱物","金属","砂"], a:1, e:"地球の表面（地殻）は岩石でできていて、その岩石は「鉱物」の集まりです。鉱物のうち条件を満たすものが宝石と呼ばれます。", p:6},
 {q:"世界で見つかっている鉱物は、およそ何種類？", c:["約130種類","約470種類","約4700種類","約4万7000種類"], a:2, e:"約4700種類あるとされ、今も毎年新しい鉱物が見つかっています。", p:6},
 {q:"約4700種類の鉱物のうち、宝石とされているのはおよそ何種類？", c:["約13種類","約130種類","約1300種類","すべて"], a:1, e:"宝石とされるのは約130種類。鉱物全体のほんの一部です。", p:6},
 {q:"「鉱物はきれいに磨けば、どれでも宝石になる」。正しい？", c:["正しい","まちがい"], a:1, e:"まちがいです。磨いても、3つの条件（美しさ・耐久性・希少性）を満たさなければ宝石としては扱われません。", p:6},
 {q:"宝石の3つの条件に「入らない」ものはどれ？", c:["美しいこと","耐久性があること","希少性があること","大きいこと"], a:3, e:"3つの条件は ①美しさ（色・透明度・内包物が少ない）②耐久性（硬さ・衝撃や熱や薬品への強さ）③希少性（産出量が少なく手に入りにくい）。大きさは入っていません。", p:6},
 {q:"次のうち「有機宝石」（生き物から生まれた宝石）はどれ？", c:["ダイヤモンド","ルビー","オパール","真珠"], a:3, e:"有機宝石は生き物の活動から生まれた宝石です。真珠・珊瑚・琥珀・ジェット・象牙などがあります。", p:6},
 {q:"次のうち「無機宝石」（地球の活動から生まれた宝石）はどれ？", c:["サファイア","珊瑚","琥珀","象牙"], a:0, e:"無機宝石はマグマが冷え固まるなど、地質学的な出来事から生まれた宝石。宝石の多くはこちらです。", p:6},
 {q:"「人類最古の宝石のひとつ」と言われるものはどれ？", c:["エメラルド","ジェット（黒玉）","ダイヤモンド","トパーズ"], a:1, e:"ジェットは紀元前から装飾品として身に着けられていたため、人類最古の宝石のひとつとも言われます。", p:6}
]},

{ id:"c1s2", title:"宝石が生まれる場所", star:2, pages:"p.6〜7", qs:[
 {q:"ジェット（黒玉）は、もともと何だった？", c:["火山の灰","動物の骨","太古の樹木","貝がら"], a:2, e:"太古の樹木が海の底などに積もり、長い時間をかけて化石になったものです。", p:6},
 {q:"有機宝石の特徴として正しいものはどれ？", c:["硬くて傷がつきにくい","比較的やわらかく加工しやすいが、傷がつきやすい","すべて鉱物でできている","歴史のある宝石は少ない"], a:1, e:"有機宝石は鉱物ではなく有機物。硬度が低めで加工しやすい反面、傷つきやすいのが特徴です。歴史のある宝石が多いのも特徴です。", p:6},
 {q:"「表層の深部」（地下の深いところ）で生まれる鉱物はどれ？", c:["オパール","ターコイズ","カルセドニー","ダイヤモンド"], a:3, e:"深部で生まれるのはダイヤモンド・ガーネット・ペリドットなど。", p:7},
 {q:"「地表近く」で生まれる鉱物はどれ？", c:["ターコイズ","ガーネット","ペリドット","ルビー"], a:0, e:"地表近くで生まれるのはオパール・カルセドニー・ターコイズなど。", p:7},
 {q:"「深部と地表近くの中間」で生まれる鉱物はどれ？", c:["ダイヤモンド","オパール","サファイア","ペリドット"], a:2, e:"中間で生まれるのはトパーズ・ムーンストーン・ルビー・サファイアなど。マグマや熱水に溶けていた成分が、温度と圧力が下がって固まってできます。", p:7},
 {q:"最も深いと言われるダイヤモンド鉱山は、地下およそ何メートル？", c:["約100m","約1000m","約1万m","約10万m"], a:1, e:"地下約1000m。人が潜れる深さには限りがあるので、火山活動などで鉱物が浅いところまで運ばれてくることが大切です。", p:7},
 {q:"鉱物を人が見つけられるのは、何のおかげ？", c:["地殻変動","雨や雪","人工的な爆破","海の潮の満ち引き"], a:0, e:"鉱物は地殻変動がなくては見つけられません。火山活動などで、人が手にできる深さまで運ばれてきます。", p:7},
 {q:"鉱物がまだ山に残っていても、鉱山が閉山になるのはどんなとき？", c:["観光客が増えたとき","新しい鉱物が見つかったとき","採掘コストが販売価格を上回るとき","職人が足りなくなったとき"], a:2, e:"掘る費用が売れる値段より高くなると、採算が合わず閉山になります。", p:7}
]},

{ id:"c1s3", title:"宝石の5つの分類", star:2, pages:"p.8", qs:[
 {q:"研磨やカット以外に、人の手が加わっていない宝石を何という？", c:["処理宝石","天然宝石","人工宝石","模造宝石"], a:1, e:"天然宝石は、研磨・カット以外の人為的な操作が加わっていない宝石です。", p:8},
 {q:"宝石本来の美しさを引き出すための「最小限の処理」を何という？", c:["トリートメント","コーティング","エンハンスメント","イミテーション"], a:2, e:"エンハンスメントは最小限の処理。変色・脱色などの大幅な改良はトリートメントと呼びます。", p:8},
 {q:"変色や脱色など「大幅な改良」を行う処理を何という？", c:["トリートメント","エンハンスメント","ポリッシュ","カボション"], a:0, e:"トリートメントは処理の度合いが大きく、宝石としての価値が下がることもあります。", p:8},
 {q:"化学成分や内部構造は天然と同じだが、人間が作った宝石を何という？", c:["模造宝石","人造宝石","人工宝石（合成宝石）","処理宝石"], a:2, e:"人工宝石（合成宝石）は見た目も天然とよく似ていますが、人工的に作られているため正式な宝石とは認められていません。", p:8},
 {q:"キュービックジルコニアは、5つの分類のうちどれ？", c:["天然宝石","人工宝石","模造宝石","人造宝石"], a:3, e:"人造宝石は、自然界に存在しない組成で作られたもの。キュービックジルコニアはダイヤモンドの代用品の代表例です。", p:8},
 {q:"スワロフスキーやラインストーンは、5つの分類のうちどれ？", c:["模造宝石（イミテーション）","人造宝石","処理宝石","人工宝石"], a:0, e:"ガラスやプラスチックなどで天然宝石に似せて作ったものが模造宝石です。正式な宝石ではありません。", p:8},
 {q:"処理をした宝石について「処理の内容を必ず明記する」と定めているのはどこのルール？", c:["GIA（米国宝石学会）","CIBJO（国際貴金属宝飾品連盟）","モース硬度","ユネスコ"], a:1, e:"CIBJO（国際貴金属宝飾品連盟）のルールで、変色や処理などの詳細の明記が求められています。", p:8, tip:"目で確認できない処理の情報は、その石の価値を判断する重要な材料です。"},
 {q:"処理の度合いが大きいほど、宝石としての価値はふつうどうなる？", c:["上がる","変わらない","下がる","必ず0円になる"], a:2, e:"処理が大きいほど本来の価値は低くなります。ただし軽度のオイル・樹脂含浸・ワックス・加熱は一定の価値が認められることもあります。", p:8}
]},

{ id:"c1s4", title:"宝石の処理の歴史", star:3, pages:"p.9", qs:[
 {q:"1820年頃の宝石の加工は、主にどんなものだった？", c:["放射線の照射","表面の塗装・コーティングや台座の着色","高温高圧処理","ベリリウム拡散"], a:1, e:"色そのものを変えるのではなく、美しく見せるための単純な加工が主流でした。特にメノウの染色が有名です。", p:9},
 {q:"市場に出回っているシトリン（黄水晶）のほとんどは、もともと何？", c:["加熱したアメシスト","染めたガラス","照射したトパーズ","天然のシトリン"], a:0, e:"1883年、ブラジルでアメシストを250℃以上で加熱するとシトリンに変わることが発見されました。天然のシトリンは非常に稀です。", p:9},
 {q:"グリーンベリルを500℃前後で加熱すると、何という宝石になる？", c:["エメラルド","アクアマリン","モルガナイト","ヘリオドール"], a:1, e:"グリーンベリルは加熱で青く変色し、アクアマリンになります。", p:9},
 {q:"1960年代、タイで開発された技術はどれ？", c:["ダイヤの放射線処理","1900℃前後の高温加熱で黒みの強いルビーを美しくする技術","トパーズを青くする照射","エメラルドのオイル含浸"], a:1, e:"ルビーやサファイアの加熱は昔からありましたが、黒みを取り除く技術がこの頃から大きく進歩しました。", p:9},
 {q:"市場のブルートパーズの約99％は、どうやって色がついている？", c:["天然のまま","加熱","放射線照射","染色"], a:2, e:"無色のトパーズに放射線を照射して青くしたものが市場の約99％です。", p:9},
 {q:"照射処理の有無は鑑別できないため、一般的にはどう扱われる？", c:["未処理として扱う","照射されたものとして扱う","模造宝石として扱う","鑑別書は出せない"], a:1, e:"照射の有無は見分けられないので、モルガナイト・ヘリオドールなどは照射されたものとして扱われます。", p:9},
 {q:"2001年以降に「未処理の石」として出回り、大問題になったのは？", c:["加熱ルビー","ベリリウム拡散処理のパパラチアサファイア","照射ブルートパーズ","オイル含浸エメラルド"], a:1, e:"ピンクサファイアをオレンジにするベリリウム拡散処理がされた石でした。今は鑑別でき、安価で取引されています。", p:9},
 {q:"茶色のダイヤに放射線処理などをして色を変えたものを何と呼ぶ？", c:["ファンシーカラーダイヤモンド","アンカットダイヤモンド","トリーティド・カラーダイヤモンド","ホープダイヤモンド"], a:2, e:"トリーティド・カラーダイヤモンド（トリートカラー）と呼ばれます。天然のファンシーカラーとは価値がまったく違います。", p:9, tip:"カラーダイヤは天然か処理かで価値が大きく変わります。"},
 {q:"ダイヤをピンクやブルーにする「HPHT処理」の意味は？", c:["高温高圧","高周波加熱","表面拡散","樹脂含浸"], a:0, e:"HPHTは High Pressure High Temperature、高温高圧処理のことです。", p:9}
]},

{ id:"c1s5", title:"四大宝石と誕生石", star:1, pages:"p.9〜11", qs:[
 {q:"世界四大宝石に「入らない」ものはどれ？", c:["ダイヤモンド","ルビー","アレキサンドライト","エメラルド"], a:2, e:"世界四大宝石はダイヤモンド・ルビー・サファイア・エメラルド。アレキサンドライトは五大宝石の候補です。", p:9},
 {q:"五大宝石の「5つ目」の候補に入らないものはどれ？", c:["アレキサンドライト","翡翠","真珠","トパーズ"], a:3, e:"5つ目はアレキサンドライト、翡翠、真珠のどれかで、国や地域で違います。普遍的な定義はありません。", p:9},
 {q:"「貴石」と「半貴石」の区別について正しいものは？", c:["法律で決まっている","明確な定義はない","GIAが決めている","値段で自動的に決まる"], a:1, e:"明確な定義はなく、今はまとめて「カラーストーン」や「ジェムストーン」と呼ぶことが多いです。", p:9},
 {q:"誕生石を考案したのは？", c:["18世紀ポーランドの宝石商","古代エジプトの王","20世紀の日本の百貨店","GIA"], a:0, e:"誕生石は18世紀にポーランドの宝石商が考案しました。", p:10},
 {q:"誕生石が統一されたのは、1912年のどこの大会？", c:["パリの万国博覧会","アメリカ・カンザスシティの米国宝石組合大会","ロンドンの宝石商会議","東京の宝石卸商会"], a:1, e:"それまでは宝石商ごとに違っていたものが、ここで統一されました。", p:10},
 {q:"日本の誕生石が発表されたのは何年？", c:["1912年","1958年","1989年","2021年"], a:1, e:"1958年。アメリカとほぼ同じですが、珊瑚と翡翠が加えられています。", p:10},
 {q:"2021年の見直しで、日本の誕生石は全部で何石になった？", c:["12石","24石","29石","36石"], a:2, e:"全国宝石卸商協同組合が63年ぶりに見直し、全29石になりました。", p:10},
 {q:"5月の誕生石はどれ？", c:["エメラルド・翡翠","ルビー・スフェーン","ペリドット・スピネル","オパール・トルマリン"], a:0, e:"5月はエメラルドとジェイダイト（翡翠）。意味は幸運・幸福です。", p:10},
 {q:"12月の誕生石に「入らない」ものはどれ？", c:["タンザナイト","ターコイズ","ラピスラズリ","ペリドット"], a:3, e:"12月はターコイズ・ラピスラズリ・タンザナイト・ジルコン。ペリドットは8月です。", p:10},
 {q:"誕生石の選び方として正しいものは？", c:["必ず1番目の石を選ぶ","生まれた月の石を持たないといけない","月が合っていればどの石を選んでもよい","日本の誕生石は海外では使えない"], a:2, e:"誕生石は宝石商が販売しやすいよう決めたもの。月さえ合っていれば好みで選んで構いません。", p:11},
 {q:"イギリスで4月の誕生石に選ばれているのは？", c:["ダイヤモンド","ロッククリスタル","クリソプレーズ","カーネリアン"], a:1, e:"クオーツ好きが多いイギリスでは、4月にロッククリスタル、5月にクリソプレーズ、7月にカーネリアンが選ばれています。", p:11}
]},

{ id:"c1s6", title:"モース硬度と資産価値", star:2, pages:"p.12〜13", qs:[
 {q:"モース硬度を考えたのは、どこの国の鉱物学者？", c:["イギリス","アメリカ","ドイツ","ロシア"], a:2, e:"ドイツの鉱物学者フリードリッヒ・モースが考案しました。", p:12},
 {q:"モース硬度は何段階？", c:["5段階","7段階","10段階","100段階"], a:2, e:"鉱物同士をこすり合わせて、傷のつきにくさを10段階で表したものです。", p:12},
 {q:"モース硬度「9」の鉱物は？", c:["トパーズ","コランダム（ルビー・サファイア）","石英（クオーツ）","ダイヤモンド"], a:1, e:"10がダイヤモンド、9がコランダム（ルビー・サファイア）、8がトパーズ・スピネルです。", p:12},
 {q:"アメシストやシトリン（石英）のモース硬度は？", c:["5","6","7","8"], a:2, e:"石英（クオーツ・アメシスト・シトリン）は7です。", p:12},
 {q:"モース硬度「1」の、最もやわらかい鉱物は？", c:["石膏（ジプサム）","滑石（タルク）","方解石（カルサイト）","蛍石（フローライト）"], a:1, e:"1は滑石（タルク）、2は石膏、3は方解石、4は蛍石です。", p:12},
 {q:"正しいのはどっち？", c:["9と10の差は、1と9の差より大きい","9と10の差は、1と9の差より小さい"], a:0, e:"数字は順番を表すだけ。ダイヤモンドはそれほど飛び抜けて硬い鉱物です。", p:12},
 {q:"硬いダイヤモンドでも、落とすと割れることがあるのはなぜ？", c:["靭性（衝撃への強さ）が低く、劈開という割れやすい方向があるから","熱に弱いから","水に溶けるから","中が空洞だから"], a:0, e:"硬さ（傷のつきにくさ）と、衝撃への強さ（靭性）は別物です。劈開は原子の結びつきが弱い面に沿って割れる性質です。", p:12, tip:"「ダイヤだから絶対に欠けない」とは限りません。角やガードルの欠けも確認しましょう。"},
 {q:"宝石の品質を判断する7要素に「入らない」ものはどれ？", c:["産地","処理の有無","購入したお店","不完全性"], a:2, e:"7要素は、色相と鉱物種・産地・処理の有無・姿と輝き・濃淡・不完全性・サイズです。", p:13},
 {q:"宝石は平均して何年で持ち主が変わると言われる？", c:["約5年","約10年","約30年","約100年"], a:2, e:"世代を超えて受け継がれたり、オークションで流通したりして、平均約30年で持ち主が変わるといわれます。", p:13},
 {q:"「還流品」とは何のこと？", c:["海外から輸入した原石","一度消費者に渡った宝石が、市場に戻ってきたもの","工場で作られた合成石","川で採れた宝石"], a:1, e:"21世紀になって、還流品が流通する市場が整備されてきました。", p:13, tip:"買取店で扱う宝石の多くがまさに還流品です。"},
 {q:"カラーストーンの中で、サファイアの次に売り上げを伸ばしている宝石は？", c:["タンザナイト","トルマリン","ガーネット","アクアマリン"], a:0, e:"十数年後には鉱山が底をつくと予想され、希少性への期待から人気が上がっています。", p:13},
 {q:"ダイヤモンドが「インフレに強い」と言われる理由は？", c:["毎年たくさん見つかるから","取り扱う企業が供給量を決めているから","国が値段を決めているから","合成ダイヤが存在しないから"], a:1, e:"供給量がコントロールされているため、大きな価格変動が起きにくいとされています。", p:13}
]},

{ id:"c1s7", title:"宝石の各部名称", star:2, pages:"p.14", qs:[
 {q:"図の色がついている部分の名前は？", img:"anat-crown", c:["パビリオン","クラウン","ガードル","キューレット"], a:1, e:"ガードルを境にした上側の部分がクラウンです。", p:14},
 {q:"図の色がついている部分の名前は？", img:"anat-pavilion", c:["クラウン","テーブル","パビリオン","ベゼル"], a:2, e:"ガードルを境にした下側の部分がパビリオンです。", p:14},
 {q:"図の色がついている部分の名前は？", img:"anat-girdle", c:["ガードル","キューレット","テーブル","クラウン"], a:0, e:"宝石の外周部で、クラウンとパビリオンの境目がガードルです。", p:14},
 {q:"図の色がついている、いちばん上の平らな面の名前は？", img:"anat-table", c:["スターファセット","テーブルファセット","ベゼルファセット","キューレット"], a:1, e:"真上にある大きな平らな面がテーブルファセットです。", p:14},
 {q:"図の色がついている、いちばん下の先端の名前は？", img:"anat-culet", c:["ガードル","パビリオンファセット","キューレット","テーブル"], a:2, e:"パビリオンの先端がキューレットです。", p:14},
 {q:"ラウンドブリリアントカットのクラウンは、何面のファセットでできている？", c:["25面","33面","58面","8面"], a:1, e:"テーブル1面＋スター8面＋ベゼル8面＋アッパーガードル16面＝33面です。", p:14},
 {q:"ラウンドブリリアントカットのパビリオンは、何面？", c:["16面","25面","33面","58面"], a:1, e:"ローワーガードル16面＋パビリオン8面＋キューレット1面＝25面です。", p:14},
 {q:"ラウンドブリリアントカット全体のファセットの数は？（クラウン＋パビリオン）", c:["33面","48面","58面","64面"], a:2, e:"33面＋25面＝58面です。", p:14},
 {q:"アッパーガードルファセットは何面？", c:["1面","8面","16面","25面"], a:2, e:"クラウンのガードル寄りにある小さな面で、16面あります。", p:14},
 {q:"「ファセット」とは何のこと？", c:["宝石の重さ","カットでできた一つひとつの面","宝石の内包物","指輪の台座"], a:1, e:"カットによって表面にできた一つひとつの面をファセットといい、それを幾何学的に組み合わせた切り方がファセットカットです。", p:14}
]},

{ id:"c1s8", title:"カットを見分けよう", star:2, pages:"p.15〜19", qs:[
 {q:"このカットの名前は？", img:"cut-round", c:["クッションシェイプ","ラウンドブリリアント","ハートシェイプ","カボション"], a:1, e:"真上から見て真円に近いのがラウンドブリリアントカット。婚約指輪にも多く使われます。", p:15},
 {q:"このカットの名前は？", img:"cut-pear", c:["マーキス","ハートシェイプ","ペアシェイプ","トリリアント"], a:2, e:"涙や洋梨（pear）のような形がペアシェイプカットです。", p:15},
 {q:"このカットの名前は？", img:"cut-marquise", c:["マーキス","ペアシェイプ","オーバル","バゲット"], a:0, e:"両端がシャープにしぼられた舟形のカットがマーキスです。", p:15},
 {q:"このカットの名前は？", img:"cut-cushion", c:["プリンセス","エメラルドカット","クッションシェイプ","カレ"], a:2, e:"丸みのある四角形で、クッションを思わせる形。「ピローカット」とも呼ばれます。", p:16},
 {q:"このカットの名前は？", img:"cut-heart", c:["トリリアント","ハートシェイプ","ペアシェイプ","マーキス"], a:1, e:"ハートの形に研磨されたカット。アメリカ発祥です。", p:16},
 {q:"このカットの名前は？", img:"cut-trilliant", c:["トリリアント","プリンセス","ハートシェイプ","バゲット"], a:0, e:"三角形のブリリアントカットがトリリアント。三角形の原石「マクル」を活かしたカットです。", p:16},
 {q:"このカットの名前は？", img:"cut-emerald", c:["バゲット","プリンセス","クッションシェイプ","エメラルドカット"], a:3, e:"四角形の四隅を落とした形のステップカットがエメラルドカットです。", p:17},
 {q:"このカットの名前は？", img:"cut-baguette", c:["エメラルドカット","バゲット","カレ","プリンセス"], a:1, e:"長方形のステップカットで、四隅を落とさないのがバゲットです。", p:17},
 {q:"このカットの名前は？", img:"cut-princess", c:["カレ","クッションシェイプ","プリンセス","エメラルドカット"], a:2, e:"上から見ると四角形ですが、裏側（パビリオン）はブリリアントカットのように研磨されているのがプリンセスカットです。", p:18},
 {q:"このカットの名前は？", img:"cut-cabochon", c:["ラウンドブリリアント","ステップカット","トリリアント","カボションカット"], a:3, e:"ドーム型に丸く磨いたのがカボションカット。略して「キャブ」とも呼ばれます。", p:19},
 {q:"図のように、表と裏の両方がドーム型のカボションを何という？", img:"cab-double", c:["シングルカボション","ダブルカボション","ステップカボション","ローズカット"], a:1, e:"表だけドーム型ならシングル、表裏ともドーム型ならダブルカボションカットです。", p:19}
]},

{ id:"c1s9", title:"カットの知識", star:3, pages:"p.15〜19", qs:[
 {q:"ファセットカットは大きく分けて何と何？", c:["ブリリアントカットとステップカット","カボションとローズカット","ラウンドとオーバル","ハートとペア"], a:0, e:"ファセットカットはブリリアントカットとステップカットの2つに大きく分けられます。", p:15},
 {q:"ダイヤモンドの光の放ち方を何と呼ぶ？", c:["パフォーマンス","プロポーション","クラリティ","カラット"], a:0, e:"カットが違うと「パフォーマンス」と呼ばれる光の放ち方にも違いが出ます。", p:15},
 {q:"透明度の低い、低品質な原石のほとんどに施されるカットは？", c:["エメラルドカット","バゲット","ラウンドブリリアントカット","カレ"], a:2, e:"強い光を放つカットなので、輝きを強くする目的でラウンドブリリアントにされます。", p:15},
 {q:"細めと太めのペアシェイプでは、価格にどれくらいの差が出ることがある？", c:["ほぼ同じ","1.2倍ほど","3〜4倍","100倍"], a:2, e:"細めと太めではカラットも倍近く変わり、価格も3〜4倍の差が生まれます。", p:15},
 {q:"18世紀に確立され、当時のダイヤモンドの主流だったカットは？", c:["プリンセス","クッションシェイプ","ハートシェイプ","マーキス"], a:1, e:"クッションシェイプは正八角形の原石の形に沿って研磨されたカットで、18世紀の主流でした。", p:16},

<script>
(function(){
const D = window.GEM_DATA;
const MARK = ["A","B","C","D","E"];
const view = document.getElementById("view");
const esc = s => String(s).replace(/[&<>"]/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));

/* ---------- 問題の下ごしらえ（IDと、選択肢の並びを固定シャッフル） ---------- */
function hash(s){let h=2166136261;for(const ch of s){h^=ch.codePointAt(0);h=Math.imul(h,16777619)}return h>>>0}
function rng(seed){return()=>{seed=(seed+0x6D2B79F5)|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const ALL = [];
const STAGES = [];
D.chapters.forEach(ch => ch.stages.forEach((st, si) => {
  st.chapter = ch; st.no = ch.no + "-" + (si+1);
  st.qs.forEach((q, qi) => {
    q.id = st.id + "-" + (qi+1); q.stage = st;
    // 数字の並び（年・％など）や2択は順番を保つ。それ以外は問題ごとに決まった並びに入れ替える
    const keep = q.c.length < 3 || q.c.every(c => /\d/.test(c));
    let order = q.c.map((_, i) => i);
    if (!keep) { const r = rng(hash(q.id)); for (let i = order.length-1; i > 0; i--) { const j = Math.floor(r()*(i+1)); [order[i], order[j]] = [order[j], order[i]]; } }
    q.choices = order.map(i => q.c[i]); q.ans = order.indexOf(q.a);
    ALL.push(q);
  });
  STAGES.push(st);
}));

/* ---------- 記録（この端末のブラウザに保存） ---------- */
const KEY = "gemquest-v2";
let S = { best:{}, wrong:{}, answered:0, correct:0 };
try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(S, JSON.parse(raw)); } catch(e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) {} };
const cleared = st => { const b = S.best[st.id]; return b !== undefined && b/st.qs.length >= 0.8; };
const perfect = st => S.best[st.id] === st.qs.length;

/* ---------- 図（イラスト） ---------- */
let gid = 0;
function gemDefs(id, c1, c2){return `<defs><radialGradient id="${id}" cx="40%" cy="35%" r="75%"><stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></radialGradient></defs>`}
const pts = a => a.map(p => p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ");
function centroid(P){let x=0,y=0;P.forEach(p=>{x+=p[0];y+=p[1]});return[x/P.length,y/P.length]}
function brilliant(P, c1, c2, C){
  const id = "g"+(++gid); C = C || centroid(P); const n = P.length;
  const T = []; for (let i = 0; i < n; i += 2) T.push([C[0]+(P[i][0]-C[0])*0.5, C[1]+(P[i][1]-C[1])*0.5]);
  let lines = "";
  T.forEach((t, k) => { const i = k*2; [P[(i-1+n)%n], P[i], P[(i+1)%n]].forEach(p => lines += `<line x1="${t[0].toFixed(1)}" y1="${t[1].toFixed(1)}" x2="${p[0].toFixed(1)}" y2="${p[1].toFixed(1)}"/>`); });
  return `<svg viewBox="0 0 200 200" role="img">${gemDefs(id,c1,c2)}<polygon points="${pts(P)}" fill="url(#${id})" stroke="${c2}" stroke-width="2"/><g stroke="#fff" stroke-opacity=".55" stroke-width="1.1">${lines}<polygon points="${pts(T)}" fill="#fff" fill-opacity=".14"/></g></svg>`;
}
function stepcut(P, c1, c2, levels){
  const id = "g"+(++gid); const C = centroid(P);
  const scale = s => P.map(p => [C[0]+(p[0]-C[0])*s, C[1]+(p[1]-C[1])*s]);
  const L = levels.map(scale);
  let g = L.map((l, i) => `<polygon points="${pts(l)}" fill="${i===L.length-1?"#fff":"none"}" fill-opacity=".12"/>`).join("");
  P.forEach((p, i) => { const q = L[L.length-1][i]; g += `<line x1="${p[0].toFixed(1)}" y1="${p[1].toFixed(1)}" x2="${q[0].toFixed(1)}" y2="${q[1].toFixed(1)}"/>`; });
  return `<svg viewBox="0 0 200 200" role="img">${gemDefs(id,c1,c2)}<polygon points="${pts(P)}" fill="url(#${id})" stroke="${c2}" stroke-width="2"/><g stroke="#fff" stroke-opacity=".6" stroke-width="1.1">${g}</g></svg>`;
}
function sample(f, n, t0, t1){const a=[];for(let i=0;i<n;i++){a.push(f(t0+(t1-t0)*i/n))}return a}
const ART = {
  "cut-round": () => brilliant(sample(t=>[100+80*Math.cos(t-Math.PI/2),100+80*Math.sin(t-Math.PI/2)],16,0,2*Math.PI),"#ffffff","#9fb6c8"),
  "cut-pear": () => brilliant(sample(t=>[100+92*Math.sin(t)*Math.abs(Math.sin(t/2)),100-86*Math.cos(t)],16,0,2*Math.PI),"#ff6b7f","#8e1028",[100,122]),
  "cut-marquise": () => brilliant(sample(t=>[100+50*Math.sin(t)*Math.abs(Math.sin(t)),100-88*Math.cos(t)],16,0,2*Math.PI),"#6f9ef0","#1a3f8f"),
  "cut-cushion": () => brilliant(sample(t=>{const c=Math.cos(t),s=Math.sin(t);return[100+78*Math.sign(c)*Math.pow(Math.abs(c),.5),100+78*Math.sign(s)*Math.pow(Math.abs(s),.5)]},16,-Math.PI/2,1.5*Math.PI),"#ffb3c9","#c03a6a"),
  "cut-heart": () => brilliant(sample(t=>[100+5.1*16*Math.pow(Math.sin(t),3),92-5.1*(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t))],16,0,2*Math.PI),"#ff5a6e","#9b1030",[100,104]),
  "cut-trilliant": () => { const V=[[100,16],[176,148],[24,148]], P=[]; for(let k=0;k<3;k++){const a=V[k],b=V[(k+1)%3],m=[(a[0]+b[0])/2,(a[1]+b[1])/2],d=[m[0]-100,m[1]-104],L=Math.hypot(d[0],d[1]),c=[m[0]+d[0]/L*14,m[1]+d[1]/L*14];for(let i=0;i<6;i++){const t=i/6;P.push([(1-t)*(1-t)*a[0]+2*(1-t)*t*c[0]+t*t*b[0],(1-t)*(1-t)*a[1]+2*(1-t)*t*c[1]+t*t*b[1]])}} return brilliant(P,"#7fe0a0","#16794a",[100,108]); },
  "cut-princess": () => { const id="g"+(++gid), o=[[22,22],[178,22],[178,178],[22,178]], t=[[62,62],[138,62],[138,138],[62,138]], m=[[100,22],[178,100],[100,178],[22,100]]; let l=""; o.forEach((p,i)=>l+=`<line x1="${p[0]}" y1="${p[1]}" x2="${t[i][0]}" y2="${t[i][1]}"/>`); m.forEach((p,i)=>{[t[i],t[(i+1)%4]].forEach(q=>l+=`<line x1="${p[0]}" y1="${p[1]}" x2="${q[0]}" y2="${q[1]}"/>`)}); l+=`<line x1="62" y1="62" x2="138" y2="138"/><line x1="138" y1="62" x2="62" y2="138"/>`; return `<svg viewBox="0 0 200 200" role="img">${gemDefs(id,"#ffffff","#a8b8c4")}<polygon points="${pts(o)}" fill="url(#${id})" stroke="#a8b8c4" stroke-width="2"/><g stroke="#fff" stroke-opacity=".7" stroke-width="1.1">${l}<polygon points="${pts(t)}" fill="#fff" fill-opacity=".15"/></g></svg>`; },
  "cut-emerald": () => stepcut([[70,14],[130,14],[160,44],[160,156],[130,186],[70,186],[40,156],[40,44]],"#5fd39a","#0d6b40",[.82,.66,.5]),
  "cut-baguette": () => stepcut([[58,14],[142,14],[142,186],[58,186]],"#ffffff","#9fb2c2",[.8,.62]),
  "cut-cabochon": () => { const id="g"+(++gid); return `<svg viewBox="0 0 200 200" role="img">${gemDefs(id,"#7fb2ff","#173c85")}<ellipse cx="100" cy="100" rx="66" ry="84" fill="url(#${id})"/><ellipse cx="80" cy="66" rx="20" ry="13" fill="#fff" fill-opacity=".55" transform="rotate(-30 80 66)"/></svg>`; },
  "cab-double": () => `<svg viewBox="0 0 240 150" role="img"><path d="M20 75 Q120 -5 220 75 Q120 155 20 75z" fill="#e2a24a" stroke="#8d5a12" stroke-width="2"/><line x1="10" y1="75" x2="230" y2="75" stroke="currentColor" stroke-dasharray="6 5" stroke-width="1.5"/><text x="120" y="146" text-anchor="middle" font-size="13" fill="currentColor">横から見た断面</text></svg>`,
  "star": () => { const id="g"+(++gid); let r=""; for(let k=0;k<3;k++){const a=k*Math.PI/3,dx=Math.cos(a)*78,dy=Math.sin(a)*78;r+=`<line x1="${(100-dx).toFixed(1)}" y1="${(100-dy).toFixed(1)}" x2="${(100+dx).toFixed(1)}" y2="${(100+dy).toFixed(1)}"/>`} return `<svg viewBox="0 0 200 200" role="img"><defs><radialGradient id="${id}" cx="50%" cy="45%" r="60%"><stop offset="0" stop-color="#f06a8a"/><stop offset="1" stop-color="#7d0f2e"/></radialGradient><filter id="${id}b"><feGaussianBlur stdDeviation="2.2"/></filter></defs><circle cx="100" cy="100" r="82" fill="url(#${id})"/><g stroke="#fff" stroke-width="5" stroke-linecap="round" filter="url(#${id}b)" opacity=".9">${r}</g><circle cx="100" cy="100" r="9" fill="#fff" filter="url(#${id}b)"/></svg>`; },
  "cat": () => { const id="g"+(++gid); return `<svg viewBox="0 0 200 200" role="img"><defs><radialGradient id="${id}" cx="50%" cy="50%" r="60%"><stop offset="0" stop-color="#d9b84a"/><stop offset="1" stop-color="#6b5a12"/></radialGradient><filter id="${id}b"><feGaussianBlur stdDeviation="3"/></filter></defs><ellipse cx="100" cy="100" rx="66" ry="86" fill="url(#${id})"/><ellipse cx="100" cy="100" rx="6" ry="80" fill="#fffbe8" filter="url(#${id}b)"/></svg>`; },
  "colorchange": () => { const a="g"+(++gid), b="g"+(++gid); return `<svg viewBox="0 0 260 160" role="img">${gemDefs(a,"#4fbfa0","#0f5a4a")}${gemDefs(b,"#d0507e","#5c0f37")}<ellipse cx="68" cy="70" rx="48" ry="58" fill="url(#${a})"/><ellipse cx="192" cy="70" rx="48" ry="58" fill="url(#${b})"/><text x="68" y="152" text-anchor="middle" font-size="14" fill="currentColor">太陽光の下</text><text x="192" y="152" text-anchor="middle" font-size="14" fill="currentColor">白熱灯の下</text><path d="M122 70h16m-6-6 6 6-6 6" stroke="currentColor" stroke-width="2" fill="none"/></svg>`; },
  "watermelon": () => `<svg viewBox="0 0 200 200" role="img"><polygon points="${pts(sample(t=>[100+84*Math.cos(t),100+84*Math.sin(t)],9,0,2*Math.PI))}" fill="#2f8a4c" stroke="#1d5a30" stroke-width="2"/><polygon points="${pts(sample(t=>[100+68*Math.cos(t),100+68*Math.sin(t)],9,0,2*Math.PI))}" fill="#eaf3e0"/><polygon points="${pts(sample(t=>[100+62*Math.cos(t),100+62*Math.sin(t)],9,0,2*Math.PI))}" fill="#e2416b"/><text x="100" y="196" text-anchor="middle" font-size="12" fill="currentColor">結晶を輪切りにしたところ</text></svg>`,
  "double": () => { const o=[[70,22],[130,22],[168,60],[168,140],[130,178],[70,178],[32,140],[32,60]], q=o.map(([x,y])=>[x+7,y+5]); return `<svg viewBox="0 0 200 220" role="img"><polygon points="${pts(o)}" fill="#b5d64f" fill-opacity=".55" stroke="#4d6a12" stroke-width="2"/><polygon points="${pts(q)}" fill="none" stroke="#4d6a12" stroke-width="1.6" stroke-dasharray="5 4"/><text x="100" y="212" text-anchor="middle" font-size="13" fill="currentColor">ガードルの線が二重に見える</text></svg>`; },
  "moon": () => { const a="g"+(++gid), b="g"+(++gid); return `<svg viewBox="0 0 200 220" role="img"><defs><radialGradient id="${a}" cx="50%" cy="45%" r="60%"><stop offset="0" stop-color="#f4f2ec"/><stop offset="1" stop-color="#b9b6ad"/></radialGradient><radialGradient id="${b}" cx="42%" cy="38%" r="40%"><stop offset="0" stop-color="#9cc8ff" stop-opacity=".95"/><stop offset="1" stop-color="#9cc8ff" stop-opacity="0"/></radialGradient></defs><ellipse cx="100" cy="100" rx="70" ry="86" fill="url(#${a})" stroke="#8d8a80" stroke-width="1.5"/><ellipse cx="88" cy="84" rx="50" ry="40" fill="url(#${b})"/><text x="100" y="212" text-anchor="middle" font-size="13" fill="currentColor">青白い光がふわっと浮かぶ</text></svg>`; },
  "opal-tone": () => { let r=""; for(let i=0;i<9;i++){const v=Math.round(20+i*28.5), c=`rgb(${v},${v},${v+4})`; r+=`<rect x="${6+i*30}" y="8" width="27" height="27" rx="4" fill="${c}" stroke="#888" stroke-opacity=".6"/><text x="${19.5+i*30}" y="52" text-anchor="middle" font-size="12" fill="currentColor">N${i+1}</text>`;} const br=(x1,x2,t,y)=>`<path d="M${x1} ${y}v6h${x2-x1}v-6" fill="none" stroke="currentColor" stroke-width="1.4"/><text x="${(x1+x2)/2}" y="${y+24}" text-anchor="middle" font-size="${t.length>4?11.5:14}" font-weight="700" fill="currentColor">${t}</text>`; return `<svg viewBox="0 0 282 100" role="img">${r}${br(6,123,"ブラック",60)}${br(126,183,"セミブラック",60)}${br(186,273,"ライト",60)}</svg>`; },
  "doublet": () => { const id="g"+(++gid); return `<svg viewBox="0 0 260 150" role="img"><defs><linearGradient id="${id}" x1="0" x2="1"><stop offset="0" stop-color="#5fd3c0"/><stop offset=".35" stop-color="#6f8ff0"/><stop offset=".65" stop-color="#e46fa4"/><stop offset="1" stop-color="#f2b44a"/></linearGradient></defs><path d="M30 60 Q130 30 230 60 L230 74 L30 74z" fill="url(#${id})"/><rect x="30" y="74" width="200" height="4" fill="#111"/><rect x="30" y="78" width="200" height="30" fill="#8a7a6a" stroke="#777"/><g font-size="12" fill="currentColor"><text x="130" y="22" text-anchor="middle">うすいオパール</text><text x="130" y="128" text-anchor="middle">黒い接着層＋母岩・コモンオパール</text><text x="130" y="146" text-anchor="middle">横から見た断面（2層）</text></g></svg>`; },
  "triplet": () => { const id="g"+(++gid); return `<svg viewBox="0 0 290 160" role="img"><defs><linearGradient id="${id}" x1="0" x2="1"><stop offset="0" stop-color="#5fd3c0"/><stop offset=".35" stop-color="#6f8ff0"/><stop offset=".65" stop-color="#e46fa4"/><stop offset="1" stop-color="#f2b44a"/></linearGradient></defs><path d="M30 76 Q130 10 230 76z" fill="#dfeef5" fill-opacity=".7" stroke="#8fb0c0" stroke-width="1.5"/><rect x="30" y="76" width="200" height="8" fill="url(#${id})"/><rect x="30" y="84" width="200" height="26" fill="#1c1c1c" stroke="#777"/><g font-size="12" fill="currentColor"><text x="130" y="56" text-anchor="middle">ガラス・水晶</text><path d="M200 80 L236 64" stroke="currentColor"/><text x="238" y="62" font-size="12">オパール</text><text x="130" y="128" text-anchor="middle">オニキス・瑪瑙など</text><text x="130" y="152" text-anchor="middle">横から見た断面（3層）</text></g></svg>`; },
  "karat": () => { const bar=(y,l,p,t)=>`<text x="10" y="${y+17}" font-size="14" font-weight="700" fill="currentColor">${l}</text><rect x="60" y="${y}" width="${2*p}" height="24" rx="4" fill="#d9a521"/><rect x="${60+2*p}" y="${y}" width="${200-2*p}" height="24" rx="4" fill="#c58a6a" fill-opacity="${p<100?1:0}"/><text x="${60+p}" y="${y+17}" text-anchor="middle" font-size="12" fill="#2a1d00">${t}</text>`; return `<svg viewBox="0 0 280 120" role="img">${bar(14,"K24",100,"金100％")}${bar(56,"K18",75,"金75％")}<text x="${60+175}" y="${56+17}" text-anchor="middle" font-size="11" fill="#2a1d00">割金25％</text><text x="140" y="112" text-anchor="middle" font-size="12" fill="currentColor">18金＝24分の18が金</text></svg>`; },
  "bicolor": () => { const id="g"+(++gid); return `<svg viewBox="0 0 200 200" role="img"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f27aa0"/><stop offset=".46" stop-color="#f6a3bd"/><stop offset=".54" stop-color="#8fd6a0"/><stop offset="1" stop-color="#2c8a4e"/></linearGradient></defs><polygon points="70,10 130,10 150,30 150,170 130,190 70,190 50,170 50,30" fill="url(#${id})" stroke="#555" stroke-opacity=".4" stroke-width="2"/><g stroke="#fff" stroke-opacity=".6" fill="none"><polygon points="76,24 124,24 138,38 138,162 124,176 76,176 62,162 62,38"/><polygon points="84,40 116,40 124,48 124,152 116,160 84,160 76,152 76,48"/></g></svg>`; }
};
function anat(part){
  const hi = "var(--accent)", base = "var(--sunk)", st = "currentColor";
  const fill = p => p === part ? hi : base;
  const crown = "85,40 155,40 220,70 20,70", girdle = "20,70 220,70 220,77 20,77", pav = "20,77 220,77 120,166";
  let extra = "", lbl = {crown:[232,52],pavilion:[200,128],girdle:[232,74],table:[150,22],culet:[150,170]}[part];
  if (part === "table") extra = `<line x1="85" y1="40" x2="155" y2="40" stroke="${hi}" stroke-width="7" stroke-linecap="round"/>`;
  if (part === "culet") extra = `<circle cx="120" cy="164" r="7" fill="${hi}"/>`;
  const target = {crown:[180,55],pavilion:[160,110],girdle:[220,73],table:[130,40],culet:[124,162]}[part];
  return `<svg viewBox="0 0 260 180" role="img"><g stroke="${st}" stroke-width="1.6" stroke-linejoin="round"><polygon points="${crown}" fill="${part==="table"||part==="culet"?base:fill("crown")}"/><polygon points="${girdle}" fill="${fill("girdle")}"/><polygon points="${pav}" fill="${part==="table"||part==="culet"?base:fill("pavilion")}"/></g><g stroke="${st}" stroke-opacity=".45" stroke-width="1"><line x1="85" y1="40" x2="55" y2="70"/><line x1="155" y1="40" x2="185" y2="70"/><line x1="105" y1="40" x2="95" y2="70"/><line x1="135" y1="40" x2="145" y2="70"/><line x1="120" y1="166" x2="70" y2="77"/><line x1="120" y1="166" x2="170" y2="77"/><line x1="120" y1="166" x2="120" y2="77"/></g>${extra}<line x1="${target[0]}" y1="${target[1]}" x2="${lbl[0]-10}" y2="${lbl[1]-5}" stroke="${hi}" stroke-width="2"/><circle cx="${lbl[0]}" cy="${lbl[1]-6}" r="11" fill="${hi}"/><text x="${lbl[0]}" y="${lbl[1]-1}" text-anchor="middle" font-size="15" font-weight="700" fill="var(--surface)">?</text></svg>`;
}
function figure(key, small){
  if (!key) return "";
  const svg = key.startsWith("anat-") ? anat(key.slice(5)) : (ART[key] ? ART[key]() : "");
  return `<div class="fig">${svg}${small?"":'<small>図はイラストです</small>'}</div>`;
}

/* ---------- 画面：ホーム ---------- */
function stars(n){return `<span class="stars" aria-label="難易度${n}">${"★".repeat(n)}<i>${"★".repeat(3-n)}</i></span>`}
function home(){
  setNav("home");
  const total = STAGES.length, done = STAGES.filter(cleared).length;
  const wrongN = Object.keys(S.wrong).filter(id => ALL.some(q => q.id === id)).length;
  const rate = S.answered ? Math.round(S.correct/S.answered*100) : null;
  let h = `<section class="panel" aria-label="これまでの記録">
    <div class="prog-top"><span>クリアしたステージ</span><b>${done} / ${total}</b></div>
    <div class="bar"><i style="width:${total?done/total*100:0}%"></i></div>
    <div class="prog-row"><span>正答率 ${rate===null?"—":rate+"％"}（これまで${S.answered}問）</span></div>
    <div class="row"><button class="btn sub" id="go-wrong" ${wrongN?"":"disabled"}>苦手を復習 ${wrongN}問</button>
      <button class="btn sub" id="go-mix">ランダム10問</button></div>
    <button class="linkbtn reset" id="reset">記録をリセットする</button><div id="confirm"></div>
  </section>`;
  const next = STAGES.find(st => !cleared(st));
  if (next) h += `<section class="next" aria-label="次のおすすめ"><div><small>${done?"次はここから":"まずはここから"}</small><b>STAGE ${next.no}　${esc(next.title)}</b><span>${lab(next.chapter)}「${esc(next.chapter.title)}」・${next.qs.length}問</span></div><button class="btn" data-quiz="${next.id}">はじめる</button></section>`;
  h += `<nav class="toc" aria-label="章へ移動">${D.chapters.map(c => `<a href="#ch-${c.id}" class="${c.stages.every(cleared)?"done":""}">${lab(c)}<span>${esc(c.short||c.title.replace(/（.*）/,""))}</span></a>`).join("")}</nav>`;
  let vol = null;
  D.chapters.forEach(ch => {
    const cd = ch.stages.filter(cleared).length;
    if ((ch.book||"") !== vol && ch.book && !ch.label) h += `<div class="vol">ここからテキスト${esc(ch.book)}の内容です</div>`;
    vol = ch.book||"";
    h += `<section class="chapter" id="ch-${ch.id}"><div class="ch-head"><span class="ch-no">${lab(ch)}</span><h2>${esc(ch.title)}</h2><span class="meta">${ch.pages}・クリア ${cd}/${ch.stages.length}</span></div>`;
    ch.stages.forEach(st => {
      const b = S.best[st.id];
      const badge = b===undefined ? `<span class="badge">未挑戦</span>` : perfect(st) ? `<span class="badge perfect">全問正解</span>` : cleared(st) ? `<span class="badge clear">クリア ${b}/${st.qs.length}</span>` : `<span class="badge">最高 ${b}/${st.qs.length}</span>`;
      h += `<div class="stage ${cleared(st)?"done":""} ${st===next?"is-next":""}"><div class="st-no"><small>STAGE</small><b>${st.no}</b></div>
        <div class="st-body"><h3>${esc(st.title)}</h3><div class="st-meta">${stars(st.star)}<span>${st.qs.length}問・${st.pages}</span>${badge}</div></div>
        <div class="st-act"><button class="btn" data-quiz="${st.id}">4択で挑戦</button><button class="btn sub" data-card="${st.id}">一問一答</button></div></div>`;
    });
    h += `<div class="stage final"><div class="st-no"><small>FINAL</small><b>${ch.no}</b></div>
      <div class="st-body"><h3>${lab(ch)} 総仕上げテスト</h3><div class="st-meta">${stars(3)}<span>章全体からランダム15問</span>${S.best["final-"+ch.id]!==undefined?`<span class="badge">最高 ${S.best["final-"+ch.id]}/15</span>`:""}</div></div>
      <div class="st-act"><button class="btn" data-final="${ch.id}">挑戦する</button></div></div></section>`;
  });
  view.innerHTML = h;
  view.querySelectorAll("[data-quiz]").forEach(b => b.onclick = () => startStage(b.dataset.quiz, "quiz"));
  view.querySelectorAll("[data-card]").forEach(b => b.onclick = () => startStage(b.dataset.card, "card"));
  view.querySelectorAll("[data-final]").forEach(b => b.onclick = () => { const ch = D.chapters.find(c => c.id === b.dataset.final); const pool = ALL.filter(q => q.stage.chapter === ch); play({title:`${lab(ch)} 総仕上げテスト`, qs:pick(pool,15), key:"final-"+ch.id, mode:"quiz"}); });
  const gw = document.getElementById("go-wrong"); if (gw) gw.onclick = () => play({title:"苦手の復習", qs:shuffle(ALL.filter(q => S.wrong[q.id])), mode:"quiz", review:true});
  document.getElementById("go-mix").onclick = () => play({title:"全範囲ランダム10問", qs:pick(ALL,10), mode:"quiz"});
  document.getElementById("reset").onclick = () => {
    document.getElementById("confirm").innerHTML = `<div class="confirm"><span>この端末のクリア記録・正答率・苦手リストをすべて消します。元に戻せません。</span><div class="row"><button class="btn sub" id="rs-no">やめる</button><button class="btn" id="rs-yes">すべて消す</button></div></div>`;
    document.getElementById("rs-no").onclick = () => { document.getElementById("confirm").innerHTML = ""; };
    document.getElementById("rs-yes").onclick = () => { S = { best:{}, wrong:{}, answered:0, correct:0 }; save(); home(); };
  };
  window.scrollTo(0, 0);
}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const pick = (a, n) => shuffle(a).slice(0, n);
function startStage(id, mode){ const st = STAGES.find(s => s.id === id); play({title:`STAGE ${st.no} ${st.title}`, qs:shuffle(st.qs), key:st.id, stage:st, mode}); }

/* ---------- 画面：出題 ---------- */
function play(run){
  run.i = 0; run.score = 0; run.streak = 0; run.missed = [];
  (run.mode === "card" ? cardStep : quizStep)(run);
}
function header(run){
  return `<div class="playbar"><button class="linkbtn" id="quit">← やめる</button><span class="ttl">${esc(run.title)}</span><span class="count">${run.i+1} / ${run.qs.length}</span></div>
  <div class="bar"><i style="width:${run.i/run.qs.length*100}%"></i></div>`;
}
function bindQuit(){ document.getElementById("quit").onclick = home; }
function explainHTML(q){
  return `<p>${esc(q.e)}</p>${q.tip?`<div class="tip"><b>買取の現場メモ</b>${esc(q.tip)}</div>`:""}<div class="src">${src(q)}・${esc(q.stage.chapter.title)}</div>`;
}
function quizStep(run){
  if (run.i >= run.qs.length) return result(run);
  const q = run.qs[run.i];
  view.innerHTML = header(run) + `<section class="card"><div class="qlabel">第${run.i+1}問${run.streak>=3?`<span class="streak">${run.streak}問連続正解中</span>`:""}</div>
    <p class="q">${esc(q.q)}</p>${figure(q.img)}
    <div class="choices">${q.choices.map((c,i)=>`<button class="choice" data-i="${i}"><span class="k">${MARK[i]}</span><span>${esc(c)}</span></button>`).join("")}</div>
    <div id="fb"></div></section>`;
  bindQuit();
  const btns = [...view.querySelectorAll(".choice")];
  const answer = pick => {
    if (btns[0].disabled) return;
    const ok = pick === q.ans;
    S.answered++; if (ok) { S.correct++; run.score++; run.streak++; if (run.review) delete S.wrong[q.id]; } else { S.wrong[q.id] = 1; run.streak = 0; run.missed.push(q); }
    save();
    btns.forEach((b, i) => { b.disabled = true; if (i === q.ans) b.classList.add("correct"); else if (i === pick) b.classList.add("wrong"); else b.classList.add("dim"); });
    document.getElementById("fb").innerHTML = `<div class="explain"><div class="verdict ${ok?"ok":"ng"}">${ok?"正解！":"ざんねん…"}</div>
      ${ok?"":`<div class="answer">正解は ${MARK[q.ans]}．${esc(q.choices[q.ans])}</div>`}${explainHTML(q)}
      <div class="row"><button class="btn" id="next">${run.i+1<run.qs.length?"次の問題へ":"結果を見る"}</button></div></div>`;
    const nx = document.getElementById("next"); nx.focus({preventScroll:true}); nx.scrollIntoView({block:"nearest",behavior:"smooth"});
    nx.onclick = () => { run.i++; quizStep(run); };
  };
  btns.forEach((b, i) => b.onclick = () => answer(i));
  keyHandler = e => { const n = parseInt(e.key, 10); if (n >= 1 && n <= btns.length) answer(n-1); };
}
function cardStep(run){
  if (run.i >= run.qs.length) return result(run);
  const q = run.qs[run.i];
  view.innerHTML = header(run) + `<section class="card"><div class="qlabel">一問一答・第${run.i+1}問</div>
    <p class="q">${esc(q.q)}</p>${figure(q.img)}
    ${/どれ|どっち|入らない|正しい|並んで/.test(q.q)?`<div class="hintc">${q.choices.map(c=>`<span>${esc(c)}</span>`).join("")}</div>`:""}
    <div id="back"><button class="btn" id="flip" style="width:100%">答えを見る</button><p class="flip-hint">頭の中で答えてから、ボタンを押してください</p></div></section>`;
  bindQuit();
  const flip = () => {
    document.getElementById("back").innerHTML = `<div class="reveal explain"><div class="answer" style="font-size:22px">答え：${esc(q.choices[q.ans])}</div>${explainHTML(q)}
      <div class="row"><button class="btn sub" id="no">まだ覚えていない</button><button class="btn" id="yes">覚えた</button></div></div>`;
    const go = ok => { S.answered++; if (ok) { S.correct++; run.score++; delete S.wrong[q.id]; } else { S.wrong[q.id] = 1; run.missed.push(q); } save(); run.i++; cardStep(run); };
    document.getElementById("yes").onclick = () => go(true);
    document.getElementById("no").onclick = () => go(false);
    document.getElementById("yes").focus({preventScroll:true});
  };
  document.getElementById("flip").onclick = flip;
  keyHandler = e => { if (e.key === " " || e.key === "Enter") { if (document.getElementById("flip")) { e.preventDefault(); flip(); } } };
}
let keyHandler = null;
document.addEventListener("keydown", e => { if (keyHandler && !e.repeat) keyHandler(e); });

/* ---------- 画面：結果 ---------- */
function result(run){
  keyHandler = null;
  const n = run.qs.length, s = run.score, pct = n ? s/n : 0;
  if (run.key && run.mode === "quiz" && (S.best[run.key] === undefined || s > S.best[run.key])) { S.best[run.key] = s; save(); }
  const card = run.mode === "card";
  const msg = card ? `覚えた問題 ${s}問。「まだ」の問題は「苦手を復習」から何度でも出題できます。`
    : pct === 1 ? "パーフェクト！ このステージは完璧です。" : pct >= 0.8 ? "合格！ ステージクリアです。" : "あと少し。80％以上正解でクリアです。";
  const idx = run.stage ? STAGES.indexOf(run.stage) : -1, next = idx >= 0 ? STAGES[idx+1] : null;
  const g = Math.min(n, 15);
  view.innerHTML = `<section class="card result"><div class="qlabel">${esc(run.title)}</div>
    <div class="score">${s}<small> / ${n}</small></div>
    <div class="gems" aria-hidden="true">${Array.from({length:g},(_,i)=>`<span class="${i < Math.round(s/n*g) ? "on" : ""}" style="animation-delay:${i*60}ms"></span>`).join("")}</div>
    <p class="rmsg">${msg}</p>
    <div class="row" style="width:100%">${!card && pct>=0.8 && next ? `<button class="btn" id="r-next">次のステージへ</button>` : `<button class="btn" id="r-again">もう一度</button>`}${run.missed.length && run.missed.length < n ? `<button class="btn sub" id="r-miss">まちがえた${run.missed.length}問だけ</button>` : ""}<button class="btn sub" id="r-home">ステージ一覧へ</button></div>
    ${run.missed.length ? `<div class="missed"><h3>${card?"まだの問題":"まちがえた問題"}（${run.missed.length}）</h3>${run.missed.map(q=>`<div class="miss">${esc(q.q)}<br><b>答え：${esc(q.choices[q.ans])}</b></div>`).join("")}</div>` : ""}
  </section>`;
  const nx = document.getElementById("r-next"); if (nx) nx.onclick = () => startStage(next.id, "quiz");
  const ag = document.getElementById("r-again"); if (ag) ag.onclick = () => play(Object.assign(run, {qs: run.stage ? shuffle(run.stage.qs) : run.review ? shuffle(ALL.filter(q => S.wrong[q.id])) : shuffle(run.qs)}));
  document.getElementById("r-home").onclick = home;
  const rm = document.getElementById("r-miss"); if (rm) rm.onclick = () => play({title: run.title + "（まちがえた問題）", qs: shuffle(run.missed), mode: run.mode, review: true});
  window.scrollTo(0, 0);
}

/* ---------- 画面：問題集 ---------- */
function book(chId){
  setNav("book");
  const chs = chId === "all" || !chId ? D.chapters : D.chapters.filter(c => c.id === chId);
  let h = `<div class="book-ctl noprint"><button class="btn ${!chId||chId==="all"?"":"sub"}" data-ch="all">すべて</button>${D.chapters.map(c=>`<button class="btn ${chId===c.id?"":"sub"}" data-ch="${c.id}">${lab(c)}</button>`).join("")}</div>
    <p class="note noprint">紙に印刷したいときは、別にお渡ししているPDF版をお使いください。</p><div class="book">`;
  chs.forEach(ch => {
    h += `<section class="bchapter"><div class="ch-head"><span class="ch-no">${lab(ch)}</span><h2>${esc(ch.title)}</h2><span class="meta">${ch.pages}</span></div>`;
    ch.stages.forEach(st => {
      h += `<div class="bstage" style="margin-top:18px"><h3>STAGE ${st.no}　${esc(st.title)}　<span class="stars">${"★".repeat(st.star)}</span></h3>
        ${st.qs.map((q,i)=>`<div class="bq"><p>問${i+1}．${esc(q.q)}</p>${q.img?figure(q.img,true):""}<ol>${q.choices.map((c,j)=>`<li>${MARK[j]}．${esc(c)}</li>`).join("")}</ol></div>`).join("")}
        <div class="ans"><h4>解答・解説</h4><ol>${st.qs.map(q=>`<li><b>${MARK[q.ans]}</b>（${esc(q.choices[q.ans])}）　${esc(q.e)}${q.tip?`<br><span style="color:var(--tip)">現場メモ：${esc(q.tip)}</span>`:""}</li>`).join("")}</ol></div></div>`;
    });
    h += `</section>`;
  });
  view.innerHTML = h + `</div>`;
  view.querySelectorAll("[data-ch]").forEach(b => b.onclick = () => book(b.dataset.ch));
  window.scrollTo(0, 0);
}

function glossary(){
  setNav("glos");
  const G = (window.GEM_GLOSSARY || []).slice().sort((a,b) => a.y.localeCompare(b.y, "ja"));
  view.innerHTML = `<label for="gq" class="note">言葉や読みがなで探せます（${G.length}語）</label><input id="gq" class="glos-search" type="search" placeholder="例：シャトヤンシー、加熱、4C" autocomplete="off"><div class="glos" id="gl"></div>`;
  const render = k => {
    const kw = k.trim().toLowerCase();
    const hit = G.filter(g => !kw || (g.t+g.y+g.d).toLowerCase().includes(kw));
    document.getElementById("gl").innerHTML = hit.length ? hit.map(g => `<div class="term"><h3>${esc(g.t)}</h3><p>${esc(g.d)}</p><div class="src">${src(g)}</div></div>`).join("") : `<p class="note">「${esc(k)}」に当てはまる言葉はありません。別の言い方でも探してみてください。</p>`;
  };
  const inp = document.getElementById("gq"); inp.oninput = () => render(inp.value); render("");
  window.scrollTo(0, 0);
}
function setNav(which){ ["home","book","glos"].forEach(k => document.getElementById("nav-"+k).setAttribute("aria-pressed", which===k)); keyHandler = null; }
function lab(ch){ return ch.label || `第${ch.no}章`; }
function src(x){ const b = x.b || (x.stage && x.stage.chapter.book); return `テキスト${b?b+" ":""}p.${x.p}`; }
document.getElementById("nav-home").onclick = home;
document.getElementById("nav-book").onclick = () => book("all");
document.getElementById("nav-glos").onclick = glossary;
document.getElementById("foot").textContent = `収録：${ALL.length}問・${STAGES.length}ステージ（${D.source}）。記録はこの端末のブラウザに保存されます。図はイラストです。`;
window.GQ = { book, home, figure };
home();
})();
</script>
